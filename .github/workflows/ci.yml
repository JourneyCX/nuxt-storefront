name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (no secrets: every runtime value falls back to an empty default)
        run: npm run build
      - name: Unit tests (only the files that exist; none is not a failure, a failing one is)
        run: |
          shopt -s nullglob
          files=(tests/*.test.ts)
          if [ ${#files[@]} -eq 0 ]; then echo "no tests/*.test.ts in this branch"; exit 0; fi
          node --experimental-strip-types --test "${files[@]}"
