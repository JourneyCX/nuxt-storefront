name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: "Build (no secrets needed; every runtime value falls back to an empty default)"
        run: npm run build
      - name: "Unit tests (at least one file must exist; more than 0 tests must run, none failing, not all skipped)"
        run: |
          shopt -s nullglob
          files=(tests/*.test.ts)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no tests/*.test.ts found: a pipeline with no tests proves nothing"; exit 1; fi
          status=0
          node --experimental-strip-types --test --test-reporter=tap "${files[@]}" > "$RUNNER_TEMP/tap.txt" || status=$?
          cat "$RUNNER_TEMP/tap.txt"
          if [ "$status" -ne 0 ]; then echo "::error::node --test exited $status"; exit 1; fi
          count() { grep -E "^# $1 [0-9]+" "$RUNNER_TEMP/tap.txt" | tail -1 | awk '{print $3}'; }
          tests=$(count tests); passed=$(count pass); skipped=$(count skipped); failed=$(count fail)
          if [ -z "$tests" ] || [ "$tests" -eq 0 ]; then echo "::error::the test run reported 0 tests"; exit 1; fi
          if [ "${failed:-0}" -ne 0 ]; then echo "::error::$failed test(s) failed"; exit 1; fi
          if [ "${passed:-0}" -eq 0 ]; then echo "::error::no test passed ($skipped skipped)"; exit 1; fi
          if [ "${skipped:-0}" -gt 0 ]; then echo "::warning::$skipped test(s) skipped"; fi
